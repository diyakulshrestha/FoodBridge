<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 500px;">
    <div class="card p-4 shadow-sm">
        <h3 class="text-center mb-4">Create an Account</h3>
        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="mb-3">
                <label>Full Name / Organization Name</label>
                <input type="text" th:field="*{name}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Email</label>
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" th:field="*{password}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Phone Number</label>
                <input type="text" th:field="*{phone}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Address</label>
                <input type="text" th:field="*{address}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Select Role</label>
                <select th:field="*{role}" class="form-select">
                    <option value="ROLE_DONOR">Food Donor (Restaurant / Event / Individual)</option>
                    <option value="ROLE_NGO">NGO / Recipient Organization</option>
                    <option value="ROLE_VOLUNTEER">Delivery Volunteer</option>
                    <option value="ROLE_ADMIN">System Administrator</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100">Register</button>
        </form>
        <p class="text-center mt-3"><a th:href="@{/login}">Already have an account? Login</a></p>
    </div>
</div>
</body>
</html>
