<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 400px;">
    <div class="card p-4 shadow-sm">
        <h3 class="text-center mb-4">System Login</h3>
        <div th:if="${param.registered}" class="alert alert-success">Registration successful! Please log in.</div>
        <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Login</button>
        </form>
        <p class="text-center mt-3"><a th:href="@{/register}">New user? Create an account</a></p>
    </div>
</div>
</body>
</html>
